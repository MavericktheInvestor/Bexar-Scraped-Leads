name: Publish Bexar Dashboard

on:
  workflow_run:
    workflows: ["Scrape Bexar County Leads"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/pages.yml'
      - 'tests/test_pages_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      # The producer commits with GITHUB_TOKEN, which does not trigger push
      # workflows. workflow_run above explicitly bridges that publishing gap.
      - name: Checkout current dashboard
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check publishing regression tests
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s tests -v
      - name: Validate dashboard data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          dashboard = Path('dashboard')
          assert (dashboard / 'index.html').is_file(), 'Missing dashboard HTML'
          data = json.loads((dashboard / 'records.json').read_text())
          assert data.get('scrape_complete') is True, 'Refusing to publish unverified or partial scraper output'
          assert isinstance(data.get('records'), list), 'Missing records list'
          assert data.get('fetched_at'), 'Missing scraper timestamp'
          assert data['total'] == len(data['records']), 'Record count mismatch'
          print(f"Publishing {data['total']} records fetched {data['fetched_at']}")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload dashboard only
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/
  deploy:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v5
