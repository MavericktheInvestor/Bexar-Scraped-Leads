name: GHL Cleanup (Remove No-Phone Contacts)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = preview only, false = delete contacts with no phone'
        required: true
        default: 'true'
        type: string

permissions:
  contents: write

concurrency:
  group: "ghl-cleanup"
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check secrets are set
        run: |
          if [ -z "$GHL_API_KEY" ]; then echo "ERROR: GHL_API_KEY secret is empty"; exit 1; fi
          if [ -z "$GHL_LOCATION_ID" ]; then echo "ERROR: GHL_LOCATION_ID secret is empty"; exit 1; fi
          echo "Secrets present. DRY_RUN=$DRY_RUN"
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}

      - name: Remove contacts without phone numbers
        run: python scraper/ghl_cleanup.py
        env:
          PYTHONUNBUFFERED: "1"
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
