name: GHL Cleanup (Remove No-Phone Contacts)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = preview only, false = delete contacts with no phone'
        required: true
        default: 'true'
        type: string

jobs:
  run:
    runs-on: ubuntu-22.04

    steps:
      - name: Hello
        run: echo "DRY_RUN=${{ github.event.inputs.dry_run }}"

      - name: Check secret
        run: echo "key_length=${#GHL_API_KEY}"
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
